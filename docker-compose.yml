services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: damigos
      POSTGRES_PASSWORD: damigos
      POSTGRES_DB: damigos
    ports:
      - "5432:5432"
    volumes:
      - damigos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  damigos_pg:
